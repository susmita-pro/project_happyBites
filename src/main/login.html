<%@ page language="java" contentType="text/html; charset=UTF-8"
    pageEncoding="UTF-8"%>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Page</title>

<style>

body{

    font-family: Arial;
    background-color: #f2f2f2;
}

.container{

    width: 350px;
    margin: 100px auto;
    background-color: white;
    padding: 30px;
    border-radius: 10px;
}

input{

    width: 100%;
    padding: 10px;
    margin-top: 10px;
}

button{

    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background-color: green;
    color: white;
    border: none;
    font-size: 16px;
}

h2{

    text-align: center;
}

</style>

</head>

<body>

<div class="container">

<h2>User Login</h2>

<form action="LoginServlet" method="post">

<input type="email"
       name="email"
       placeholder="Enter Email"
       required>

<input type="password"
       name="password"
       placeholder="Enter Password"
       required>

<button type="submit">

Login

</button>

</form>

</div>

</body>
</html>
